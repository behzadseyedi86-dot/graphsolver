name: Build APK

on:
  workflow_dispatch:

env:
  APP_ID: com.behzad.graphsolver      # شناسهٔ یکتای برنامه؛ بعد از انتشار دیگر عوض نکنید
  APP_NAME: معادله‌یاب نمودار

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Create Android project
        run: |
          test -f index.html || { echo "index.html پیدا نشد"; exit 1; }
          mkdir -p proj/app/src/main/assets proj/app/src/main/java/ir/graphsolver proj/app/src/main/res/values proj/app/src/main/res/drawable
          cp index.html proj/app/src/main/assets/index.html

          cat > proj/settings.gradle.kts <<'EOF_A'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "GraphSolver"
          include(":app")
          EOF_A

          cat > proj/build.gradle.kts <<'EOF_B'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_B

          printf 'org.gradle.jvmargs=-Xmx3g\nandroid.useAndroidX=false\n' > proj/gradle.properties

          cat > proj/app/build.gradle.kts <<'EOF_C'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "ir.graphsolver"
              compileSdk = 35
              defaultConfig {
                  applicationId = project.findProperty("appid") as String
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              signingConfigs {
                  create("rel") {
                      storeFile = file(project.findProperty("ks") as String)
                      storePassword = "graphsolver123"
                      keyAlias = "graphsolver"
                      keyPassword = "graphsolver123"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("rel")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_C

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF_D'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_D

          printf '<resources><string name="app_name">%s</string></resources>\n' "$APP_NAME" > proj/app/src/main/res/values/strings.xml

          cat > proj/app/src/main/res/drawable/ic_launcher.xml <<'EOF_E'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2748D6" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#FFFFFF" android:strokeWidth="3" android:pathData="M20,88L20,20M20,54L88,54"/>
              <path android:strokeColor="#FF7AB0" android:strokeWidth="5" android:strokeLineCap="round" android:fillColor="#00000000"
                  android:pathData="M20,54C34,14 46,14 54,54S74,94 88,54"/>
          </vector>
          EOF_E

          cat > proj/app/src/main/java/ir/graphsolver/MainActivity.kt <<'EOF_F'
          package ir.graphsolver

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.net.Uri
          import android.os.Bundle
          import android.view.ViewGroup
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var filePathCallback: ValueCallback<Array<Uri>>? = null
              private val REQ_FILE = 1001

              @Suppress("DEPRECATION")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  web.setBackgroundColor(Color.parseColor("#E9F0EE"))
                  web.layoutParams = ViewGroup.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                  web.setOnApplyWindowInsetsListener { v, insets ->
                      v.setPadding(insets.systemWindowInsetLeft, insets.systemWindowInsetTop,
                          insets.systemWindowInsetRight, insets.systemWindowInsetBottom)
                      insets
                  }
                  setContentView(web)

                  web.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      mixedContentMode = WebSettings.MIXED_CONTENT_NEVER_ALLOW
                  }
                  web.webViewClient = WebViewClient()
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          view: WebView, callback: ValueCallback<Array<Uri>>, params: FileChooserParams
                      ): Boolean {
                          filePathCallback?.onReceiveValue(null)
                          filePathCallback = callback
                          return try {
                              startActivityForResult(params.createIntent(), REQ_FILE)
                              true
                          } catch (e: Exception) {
                              filePathCallback = null
                              false
                          }
                      }
                  }
                  if (savedInstanceState != null) web.restoreState(savedInstanceState)
                  else web.loadUrl("file:///android_asset/index.html")
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  if (requestCode == REQ_FILE) {
                      val result = if (resultCode == RESULT_OK && data != null)
                          WebChromeClient.FileChooserParams.parseResult(resultCode, data) else null
                      filePathCallback?.onReceiveValue(result)
                      filePathCallback = null
                  } else super.onActivityResult(requestCode, resultCode, data)
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  web.saveState(outState)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) web.goBack() else super.onBackPressed()
              }
          }
          EOF_F

      - name: Signing key
        run: |
          if [ -f release.keystore ]; then
            echo "از کلید موجود در مخزن استفاده می‌شود"
          else
            keytool -genkeypair -keystore release.keystore -alias graphsolver -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass graphsolver123 -keypass graphsolver123 \
              -dname "CN=GraphSolver, O=GraphSolver, C=IR"
          fi

      - name: Build
        working-directory: proj
        run: gradle assembleDebug assembleRelease bundleRelease -Pappid="$APP_ID" -Pks="$GITHUB_WORKSPACE/release.keystore" --no-daemon

      - name: Collect
        run: |
          mkdir out
          cp proj/app/build/outputs/apk/release/*.apk out/graphsolver-release.apk
          cp proj/app/build/outputs/apk/debug/*.apk out/graphsolver-debug.apk
          cp proj/app/build/outputs/bundle/release/*.aab out/graphsolver-release.aab
          cp release.keystore out/release.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*
